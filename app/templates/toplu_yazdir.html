<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Asset Etiketleri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- ETİKET KARTI TASARIMI --- */
        .qr-card {
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            margin-bottom: 20px;
            
            /* Kart Boyutu (A4'te düzgün çıkması için) */
            height: 300px; 
            display: flex;
            flex-direction: column; /* Alt alta diz */
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            page-break-inside: avoid; /* Etiketin ortadan bölünmesini engelle */
            position: relative;
        }

        /* QR Kodu */
        .qr-img {
            width: 140px;
            height: 140px;
            margin-bottom: 10px;
            object-fit: contain;
        }

        /* Title (Üniversite Adı vs.) */
        .kurum-baslik {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            width: 80%;
            padding-bottom: 5px;
        }

        /* Ürün Adı (Büyük Puntolu) */
        .urun-adi {
            font-size: 1.2rem;
            font-weight: 800;
            color: #000;
            line-height: 1.2;
            margin-bottom: 5px;
            
            /* Uzun isimleri ... ile kes */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp:2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 50px;
        }

        /* Detay Bilgiler (ID, Location) */
        .meta-bilgi {
            font-size: 0.9rem;
            color: #333;
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 2px;
            width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .id-badge {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }

        /* --- YAZICI AYARLARI --- */
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; margin: 0; padding: 10px; }
            .container { width: 100% !important; max-width: none !important; padding: 0 !important; }
            
            .col-print-6 {
                width: 50%; /* Yan yana 2 tane sığdır */
                float: left;
                padding: 5px;
                box-sizing: border-box;
            }

            .qr-card {
                border: 1px solid #000; /* Yazıcıda mürekkep tasarrufu için ince kenar */
                box-shadow: none;
                height: 280px; /* Yazıcıda taşmaması için hafif küçült */
                margin-bottom: 0;
            }
            
            a[href]:after { content: none !important; }
        }
    </style>
</head>
<body>

    <div class="container mt-4 mb-4 no-print">
        <div class="card p-3 shadow-sm border-0 d-flex flex-row justify-content-between align-items-center">
            <div>
                <h4 class="mb-0 text-primary"><i class="fas fa-tags"></i> Asset Etiketleri</h4>
                <small class="text-muted">{{ qr_listesi|length }} adet etiket oluşturuldu.</small>
            </div>
            <div>
                <button onclick="window.print()" class="btn btn-primary btn-lg fw-bold me-2">
                    <i class="fas fa-print"></i> Print
                </button>
                <button onclick="window.close()" class="btn btn-outline-secondary btn-lg">Close</button>
            </div>
        </div>
        <div class="alert alert-warning mt-3">
            <i class="fas fa-info-circle"></i> <strong>İpucu:</strong> Daha düzgün çıktı almak için yazdırma ayarlarından "Kenar Boşluklarını" (Margins) <b>Yok</b> veya <b>Minimum</b> olarak seçiniz.
        </div>
    </div>

    <div class="container">
        <div class="row">
            {% for item in qr_listesi %}
            <div class="col-md-6 col-print-6"> 
                <div class="qr-card">
                    <div class="kurum-baslik">DEMİRBAŞ YÖNETİMİ</div>
                    
                    <img src="data:image/png;base64,{{ item.qr }}" class="qr-img" alt="QR">
                    
                    <div class="urun-adi">{{ item.ad }}</div>
                    
                    <div class="meta-bilgi id-badge">ID: {{ item.id }}</div>
                    <div class="meta-bilgi"><i class="fas fa-map-marker-alt"></i> {{ item.konum }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
