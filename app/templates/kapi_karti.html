<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Card - {{ konum }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* KART TASARIMI */
        .kapi-karti {
            background: white;
            width: 148mm;
            /* A5 Genişliği */
            height: 210mm;
            /* A5 Highliği */
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* İçeriği yukarı ve aşağı yay */
            align-items: center;
            position: relative;
            overflow: hidden;
            /* Taşmaları gizle */
        }

        .logo-alan {
            margin-bottom: 20px;
        }

        .uni-baslik {
            color: #002D5B;
            /* Kurumsal Mavi */
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 3px solid #F39C12;
            /* Kurumsal Turuncu */
            padding-bottom: 15px;
            width: 100%;
        }

        /* KONUM YAZISI AYARLARI (Sorunu Çözen Kısım) */
        .konum-kutusu {
            flex-grow: 1;
            /* Boşluğu doldur */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px 0;
            max-height: 300px;
            /* Maksimum yükseklik sınırı */
        }

        .konum-yazisi {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            line-height: 1.3;

            /* Çok uzun metinleri 4 satırla sınırla ve ... koy */
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            /* <-- BU SATIRI EKLE, UYARI GİDER */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-wrap: break-word;
        }

        .qr-alan {
            margin-top: auto;
            /* En alta it */
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .qr-img {
            width: 250px;
            height: 250px;
        }

        .alt-bilgi {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #777;
        }

        /* YAZDIRMA AYARLARI */
        @media print {
            body {
                background: none;
                height: auto;
                display: block;
            }

            .kapi-karti {
                width: 100%;
                height: 100vh;
                /* Tam sayfa */
                box-shadow: none;
                border: none;
                page-break-inside: avoid;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="no-print position-absolute top-0 end-0 p-4">
        <button onclick="window.print()" class="btn btn-primary btn-lg shadow">
            <i class="fas fa-print"></i> Print
        </button>
    </div>

    <div class="kapi-karti">

        <div class="w-100">
            <div class="logo-alan">
                <i class="fas fa-university fa-3x" style="color: #002D5B;"></i>
            </div>
            <h1 class="uni-baslik">AVRASYA ÜNİVERSİTESİ</h1>
        </div>

        <div class="konum-kutusu">
            <div class="konum-yazisi">
                {{ konum }}
            </div>
        </div>

        <div class="qr-alan">
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR Kod" class="qr-img">
            <div class="alt-bilgi">Detaylı bilgi için okutunuz</div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>

</html>
