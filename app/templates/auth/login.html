<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Üniversite Envanter</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/sade_logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* GENEL SAYFA YAPISI */
        body {
            background-color: #f0f2f5;
            /* Arka plan rengi */
            display: flex;
            flex-direction: column;
            /* KRİTİK NOKTA: İçerikleri alt alta dizer */
            align-items: center;
            /* Yatayda ortalar */
            justify-content: center;
            /* Dikeyde ortalar */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 1. PARÇA: LOGO ALANI (Kutunun Üstünde) */
        .brand-section {
            text-align: center;
            margin-bottom: 30px;
            /* Kartla arasındaki boşluk */
        }

        .brand-section h4 {
            color: #092442;
            /* Kurumsal Lacivert */
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .brand-section p {
            color: #6c757d;
            /* Gri alt metin */
            font-size: 0.9rem;
        }

        /* 2. PARÇA: GİRİŞ KARTI (Ortada) */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            /* Logo ve Footer dışarı çıktığı için kartın içi sadeleşti */
        }

        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 12px;
            font-size: 1rem;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-login {
            padding: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            background-color: #0d6efd;
            border: none;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }

        /* 3. PARÇA: FOOTER (Kutunun Altında) */
        .footer-section {
            margin-top: 30px;
            text-align: center;
            color: #adb5bd;
            font-size: 0.85rem;
        }

        /* MOBİL UYUM */
        @media (max-width: 576px) {
            .login-card {
                padding: 25px 20px;
            }

            .brand-section img {
                max-height: 100px !important;
                /* Mobilde logo küçülsün */
            }
        }
    </style>
</head>

<body>

    <div class="brand-section">
        <img src="{{ url_for('static', filename='img/sade_logo.png') }}" alt="Avrasya Üniversitesi"
            style="max-height: 100px; width: auto;">

        <h4>Avrasya Üniversitesi</h4>
        <p>Demirbaş & Envanter Takip Sistemi</p>
    </div>

    <div class="login-card">

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-danger text-center py-2 small mb-4">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Kullanıcı Adı</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="kullanici_adi" class="form-control border-start-0"
                        placeholder="Kullanıcı adınız" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="sifre" class="form-control border-start-0" placeholder="********"
                        required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login shadow-sm text-white">
                Giriş Yap <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>
    </div>

    <div class="footer-section">
        &copy; 2026 Üniversite Bilgi İşlem Daire Başkanlığı<br>
        v11.0 Yönetim Sistemi
    </div>

</body>

</html>
