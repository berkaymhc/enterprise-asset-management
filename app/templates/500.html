<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error - 500</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6f2e7; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .error-code { font-size: 6rem; font-weight: bold; color: #dc3545; }
        .error-msg { font-size: 1.5rem; color: #555; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div>
        <div class="error-code">500</div>
        <div class="error-msg">An unexpected error occurred in the system.</div>
        <p class="text-muted">This error is usually caused by invalid data loading attempts or database constraints.</p>
        <a href="/" class="btn btn-danger px-4 py-2">Return to Homepage</a>
    </div>
</body>
</html>
