<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Toplu QR Yazdır</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- KART TASARIMI --- */
        .qr-card {
            background: white;
            border: 2px solid #000;
            border-radius: 8px;
            margin-bottom: 20px;
            
            /* SABİT BOYUT AYARLARI */
            height: 320px; /* Yüksekliği sabitledik (A4'e sığacak ideal boyut) */
            display: flex; /* İçeriği hizalamak için Flexbox */
            flex-direction: column; /* Alt alta diz */
            justify-content: center; /* Dikeyde ortala */
            align-items: center; /* Yatayda ortala */
            padding: 15px;
            page-break-inside: avoid; /* Sayfa bölünmesini engelle */
        }

        .qr-img {
            width: 160px; /* QR kod boyutu sabit */
            height: 160px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .konum-adi {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            
            /* Uzun metinleri yönetme */
            max-height: 60px;
            overflow: hidden;
            display: -webkit-box;
            
            -webkit-line-clamp: 2; /* Mevcut Tarayıcılar İçin */
            line-clamp: 2;         /* <--- BUNU EKLE (Standart özellik) */
            
            -webkit-box-orient: vertical;
            line-height: 1.2;
        }

        .alt-bilgi {
            font-size: 0.85rem;
            color: #555;
            margin-top: 5px;
        }

        /* --- YAZICI AYARLARI --- */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background-color: white;
                margin: 0;
                padding: 10px; /* Kağıt kenar boşluğu */
            }

            .container {
                width: 100% !important;
                max-width: none !important;
                padding: 0 !important;
            }

            .row {
                display: flex;
                flex-wrap: wrap;
            }

            /* Yan yana tam 2 tane sığdırma */
            .col-print-6 {
                width: 50%;
                padding: 10px; /* Kartlar arası boşluk */
                box-sizing: border-box; /* Padding'i genişliğe dahil et */
            }

            .qr-card {
                border: 1px solid #000; /* Yazıcıda daha ince kenarlık */
                box-shadow: none;
                margin-bottom: 0; /* Margin'i padding ile hallettik */
                height: 300px; /* Yazıcıda boyutu biraz daha optimize et */
            }
            
            a[href]:after {
                content: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="container mt-4 mb-4 no-print">
        <div class="card p-3 shadow-sm border-0 d-flex flex-row justify-content-between align-items-center">
            <div>
                <h4 class="mb-0 text-primary"><i class="fas fa-print"></i> Toplu QR Yazdırma</h4>
                <small class="text-muted">{{ qr_listesi|length }} adet etiket hazır.</small>
            </div>
            <div>
                <button onclick="window.print()" class="btn btn-primary btn-lg fw-bold me-2">
                    <i class="fas fa-print"></i> Yazdır
                </button>
                <button onclick="window.close()" class="btn btn-outline-secondary btn-lg">
                    Kapat
                </button>
            </div>
        </div>
        <div class="alert alert-info mt-3">
            <i class="fas fa-info-circle"></i> Not: Bu sayfa A4 kağıda yan yana 2, alt alta 3-4 adet sığacak şekilde ayarlanmıştır.
        </div>
    </div>

    <div class="container">
        <div class="row">
            {% for item in qr_listesi %}
            <div class="col-md-6 col-print-6"> 
                <div class="qr-card">
                    <img src="data:image/png;base64,{{ item.qr }}" class="qr-img" alt="QR Kod">
                    <div class="konum-adi">{{ item.konum }}</div>
                    <div class="alt-bilgi">Envanter Takip Sistemi</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
