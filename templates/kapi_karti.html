<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kapı Kartı: {{ konum }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* KART TASARIMI */
        .kapi-karti {
            background: white;
            width: 148mm; /* A5 Boyutu (Yarım A4) */
            height: 210mm;
            padding: 40px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            border-bottom: 4px solid #0d6efd; /* Üniversite Mavisi */
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .uni-title {
            font-size: 18px;
            color: #555;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .room-number {
            font-size: 64px;
            font-weight: 900;
            color: #222;
            margin: 10px 0;
            line-height: 1.1;
        }

        .room-label {
            font-size: 24px;
            color: #0d6efd;
            font-weight: bold;
        }

        .qr-container {
            margin: 40px auto;
            border: 2px dashed #ccc;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }

        .qr-img {
            width: 250px;
            height: 250px;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }
        
        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* YAZICI AYARLARI (Sadece kağıtta görünecek kısımlar) */
        @media print {
            body { background: white; }
            .kapi-karti { 
                box-shadow: none; 
                border: 2px solid #000; /* Çerçeve olsun */
                width: 100%;
                height: 100%;
                margin: 0;
                page-break-after: always;
            }
            .print-btn { display: none; } /* Yazdır butonunu gizle */
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">🖨️ YAZDIR</button>

    <div class="kapi-karti">
        <div class="header">
            <div class="uni-title">Üniversite Envanter Sistemi</div>
        </div>

        <div class="room-label">OFİS / LOKASYON</div>
        <div class="room-number">{{ konum }}</div>

        <div class="qr-container">
            <img src="data:image/png;base64,{{ qr_code }}" class="qr-img">
        </div>

        <div class="footer">
            <p><strong>DİKKAT:</strong> Demirbaş listesini görüntülemek için<br>kamera ile okutunuz.</p>
            <p style="font-size: 12px; margin-top: 20px;">Sistem Tarihi: <script>document.write(new Date().toLocaleDateString())</script></p>
        </div>
    </div>

</body>
</html>
